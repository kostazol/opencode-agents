name: independent-6.0.1-hardening-run-v2

on:
  push:
    branches:
      - agent/6.0.1-workbench-export
    paths:
      - "automation-v2/**"
      - ".github/workflows/hardening-run-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: opencode-agents-6.0.1-independent-hardening
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    name: Resume and push commits 2-7
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sha7: ${{ steps.prepare.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: automation-source
      - uses: actions/checkout@v4
        with:
          ref: agent/6.0.1-independent-hardening
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate automation source syntax
        shell: bash
        run: python -m py_compile automation-source/automation/*.py automation-source/automation-v2/*.py
      - name: Execute or resume red-to-green commits
        id: prepare
        run: python automation-source/automation-v2/run_prepare.py automation-source work "$RUNNER_TEMP/hardening-prepare-v2"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-prepare-v2
          path: ${{ runner.temp }}/hardening-prepare-v2
          if-no-files-found: warn
          retention-days: 30

  matrix_code:
    name: Code / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha7 }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:generated
      - run: git diff --exit-code -- runtime package.json package-lock.json

  docs:
    name: Resume or push commit 8
    needs: [prepare, matrix_code]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha8: ${{ steps.docs.outputs.sha8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: automation-source
      - uses: actions/checkout@v4
        with:
          ref: agent/6.0.1-independent-hardening
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: hardening-prepare-v2
          path: input
      - id: docs
        run: python automation-source/automation-v2/run_docs.py automation-source work input/prepare.json "$RUNNER_TEMP/hardening-docs-v2"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-docs-v2
          path: ${{ runner.temp }}/hardening-docs-v2
          if-no-files-found: warn
          retention-days: 30

  matrix_candidate:
    name: Candidate / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: docs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docs.outputs.sha8 }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:generated
      - run: git diff --exit-code -- runtime package.json package-lock.json

  release:
    name: Resume or push commit 9
    needs: [prepare, docs, matrix_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      sha9: ${{ steps.release.outputs.sha9 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: automation-source
      - uses: actions/checkout@v4
        with:
          ref: agent/6.0.1-independent-hardening
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: hardening-docs-v2
          path: input
      - id: release
        run: python automation-source/automation-v2/run_release.py automation-source work input/docs.json "$RUNNER_TEMP/hardening-release-v2"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-release-v2
          path: ${{ runner.temp }}/hardening-release-v2
          if-no-files-found: warn
          retention-days: 30

  matrix_final:
    name: Final / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha9 }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:generated
      - run: git diff --exit-code -- runtime package.json package-lock.json

  publish:
    name: Publish exact-tree ZIP and draft PR
    needs: [prepare, docs, release, matrix_final]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: automation-source
      - uses: actions/checkout@v4
        with:
          ref: agent/6.0.1-independent-hardening
          fetch-depth: 0
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: hardening-release-v2
          path: input
      - run: python automation-source/automation-v2/run_publish.py automation-source work input/release.json "$RUNNER_TEMP/hardening-publication-v2"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-agents-6.0.1-release-v2
          path: ${{ runner.temp }}/hardening-publication-v2
          if-no-files-found: warn
          retention-days: 90
