name: release-gates

on:
  push:
    branches:
      - agent/6.0.1-final-complete
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact dependency graph
        run: npm ci
      - name: Verify committed generated runtime
        run: npm run check:generated
      - name: Execute complete regression baseline
        run: npm test
      - name: Typecheck against the real OpenCode plugin API
        run: npm run typecheck
      - name: Verify generated runtime remains deterministic
        run: npm run check:generated
      - name: Reject runtime and lockfile drift
        run: git diff --exit-code -- runtime package.json package-lock.json
