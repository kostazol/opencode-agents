name: final-head-verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: opencode-agents-final-head-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Final head / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: aaf1031b08826e1bbe03cfa008fc14cec517ed7b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact dependency graph
        run: npm ci
      - name: Verify generated runtime
        run: npm run check:generated
      - name: Execute complete regression baseline
        run: npm test
      - name: Typecheck against the real OpenCode plugin API
        run: npm run typecheck
      - name: Re-verify generated runtime
        run: npm run check:generated
      - name: Reject runtime and lockfile drift
        run: git diff --exit-code -- runtime package.json package-lock.json
