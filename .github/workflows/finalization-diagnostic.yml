name: finalization-executor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: opencode-agents-finalization-executor
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    name: Publish missing implementation commits
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sha_build: ${{ steps.run.outputs.sha_build }}
    steps:
      - name: Checkout runner source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: automation-source
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/6.0.1-final-complete
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        shell: bash
        run: python -m py_compile automation-source/automation/*.py automation-source/automation-v2/*.py automation-source/automation-v3/*.py automation-source/automation-v4/*.py automation-source/automation-v5/*.py automation-source/automation-v6/*.py
      - name: Run red-to-green implementation chain
        id: run
        run: python automation-source/automation-v6/run_prepare_from_main.py work "$RUNNER_TEMP/final-prepare"
      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-prepare
          path: ${{ runner.temp }}/final-prepare
          if-no-files-found: warn
          retention-days: 30

  matrix_code:
    name: Implementation / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha_build }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:generated
      - run: git diff --exit-code -- runtime package.json package-lock.json

  docs:
    name: Publish documentation commit
    needs: [prepare, matrix_code]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha_docs: ${{ steps.run.outputs.sha_docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: automation-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha_build }}
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: final-prepare
          path: input-prepare
      - name: Run documentation gates
        id: run
        run: python automation-source/automation-v6/run_docs_from_main.py work input-prepare/prepare.json "$RUNNER_TEMP/final-docs"
      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-docs
          path: ${{ runner.temp }}/final-docs
          if-no-files-found: warn
          retention-days: 30

  matrix_candidate:
    name: Candidate / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: docs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docs.outputs.sha_docs }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:generated
      - run: git diff --exit-code -- runtime package.json package-lock.json

  release:
    name: Publish release commit
    needs: [prepare, docs, matrix_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      sha_release: ${{ steps.run.outputs.sha_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: automation-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docs.outputs.sha_docs }}
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: final-docs
          path: input-docs
      - name: Run final local gates and release metadata
        id: run
        run: python automation-source/automation-v6/run_release_from_main.py work input-docs/docs.json "$RUNNER_TEMP/final-release"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release
          path: ${{ runner.temp }}/final-release
          if-no-files-found: warn
          retention-days: 90

  matrix_final:
    name: Final / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha_release }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:generated
      - run: git diff --exit-code -- runtime package.json package-lock.json
